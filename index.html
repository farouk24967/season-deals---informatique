<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Season Deals - Informatique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="website icon" type="photos/Season-Deals_Dz.png" href="photos/Season-Deals_Dz.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#161b22', // Dark background from logo
                navy: '#1F2937', // Card background
                orange: '#c25e00', // Logo orange
                gold: '#eab308',   // Logo yellow/gold
                text: '#f3f4f6',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #111827; /* Dark Slate 900 */
        color: #f3f4f6;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #111827; 
      }
      ::-webkit-scrollbar-thumb {
        background: #374151; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4b5563; 
      }
      
      /* Toast Animation */
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .animate-slide-in {
        animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  <script type="importmap">

  }
}
</script>
